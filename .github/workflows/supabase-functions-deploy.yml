name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/reconcile-account/**'
      - 'supabase/functions/daily-reconciliation/**'
      - 'supabase/functions/record-payment/**'
      - 'supabase/functions/record-multi-payment/**'
      - 'supabase/functions/bulk-import/**'
      - 'supabase/functions/bulk-send-setup-invites/**'
      - 'supabase/functions/carry-over/**'
      - 'supabase/functions/accept-underpayment/**'
      - 'supabase/functions/review-payment-submission/**'
      - 'supabase/functions/manual-forfeit/**'
      - 'supabase/functions/auto-forfeit-settlement/**'
      - 'supabase/functions/recalculate-penalties/**'
      - 'supabase/functions/submit-cash-payment/**'
      - 'supabase/functions/submit-payment/**'
      - 'supabase/functions/dashboard-summary/**'
      - 'supabase/functions/add-service/**'
      - 'supabase/functions/create-cash-order/**'
      - 'supabase/functions/customer-portal/**'
      - 'supabase/functions/verify-portal-pin/**'
      - 'supabase/functions/set-portal-pin/**'
      - 'supabase/functions/send-reminders/**'
      - 'supabase/functions/send-transactional-email/**'
      - 'supabase/functions/preview-transactional-email/**'
      - 'supabase/functions/void-cash-payment/**'
      - 'supabase/functions/award-loyalty-points/**'
      - 'supabase/functions/sync-loyalty-to-sheet/**'
      - 'supabase/functions/join-loyalty-program/**'
      - 'supabase/functions/process-loyalty-redemption/**'
      - 'supabase/functions/loyalty-inactivity-check/**'
      - 'supabase/functions/auto-expire-cash-orders/**'
      - 'supabase/functions/redeem-portal-token/**'
      - 'supabase/functions/setup-customer-account/**'
      - 'supabase/functions/edit-payment-submission/**'
      - 'supabase/functions/send-loyalty-notification/**'
      - 'supabase/functions/mark-loyalty-notification-read/**'
      - 'supabase/functions/process-loyalty-notification-queue/**'
      - 'supabase/functions/cleanup-loyalty-images/**'
      - 'supabase/functions/generate-invoice/**'
      - 'supabase/functions/get-page365-order/**'
      - 'supabase/functions/append-cash-receipt/**'
      - 'supabase/functions/_shared/**'
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy reconcile-account
        if: github.event_name == 'workflow_dispatch' || contains(format('{0} {1}', join(github.event.commits.*.modified, ' '), join(github.event.commits.*.added, ' ')), 'supabase/functions/reconcile-account/')
        run: npx supabase functions deploy reconcile-account --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy daily-reconciliation
        if: github.event_name == 'workflow_dispatch' || contains(format('{0} {1}', join(github.event.commits.*.modified, ' '), join(github.event.commits.*.added, ' ')), 'supabase/functions/daily-reconciliation/')
        run: npx supabase functions deploy daily-reconciliation --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy record-payment
        if: github.event_name == 'workflow_dispatch' || contains(format('{0} {1}', join(github.event.commits.*.modified, ' '), join(github.event.commits.*.added, ' ')), 'supabase/functions/record-payment/')
