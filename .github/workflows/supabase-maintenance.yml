name: Supabase Maintenance

on:
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      - name: Live verify_jwt matrix (authoritative per-function state)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set +e
          echo "CLI version: $(npx supabase --version 2>&1)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo 'FAIL: SUPABASE_ACCESS_TOKEN secret is empty/unavailable to this workflow.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "token present: yes (length $(printf %s "$SUPABASE_ACCESS_TOKEN" | wc -c))" >> "$GITHUB_STEP_SUMMARY"
          npx supabase functions list --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} > functions-live.txt 2> functions-live.err
          rc=$?
          echo "functions list exit code: $rc | stdout bytes: $(wc -c < functions-live.txt) | stderr bytes: $(wc -c < functions-live.err)" | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo '## Live edge-function verify_jwt matrix'
            echo '```'
            cat functions-live.txt
            echo '```'
            echo '## stderr (if any)'
            echo '```'
            cat functions-live.err
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $rc -ne 0 ] || [ ! -s functions-live.txt ]; then
            echo 'Output empty or nonzero exit — retrying with --debug for root cause…' | tee -a "$GITHUB_STEP_SUMMARY"
            npx supabase functions list --debug --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} > functions-debug.txt 2>&1
            echo '## --debug retry output (tail)' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 60 functions-debug.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Schema dump (baseline; skipped if SUPABASE_DB_URL secret absent)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo 'NOTICE: SUPABASE_DB_URL secret not set — schema dump skipped.' | tee -a "$GITHUB_STEP_SUMMARY"
            echo 'To enable: repo Settings → Secrets and variables → Actions → new secret SUPABASE_DB_URL (Supabase Dashboard → Settings → Database → connection string, session pooler).' >> "$GITHUB_STEP_SUMMARY"
          else
            npx supabase db dump --db-url "$SUPABASE_DB_URL" -f schema_baseline.sql
            echo "Schema dump written: $(wc -l < schema_baseline.sql) lines" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supabase-maintenance
          path: |
            functions-live.txt
            functions-live.err
            functions-debug.txt
            schema_baseline.sql
          if-no-files-found: warn
