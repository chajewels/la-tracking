name: Deploy to Firebase Hosting

# BRANCH WORKFLOW (see CLAUDE.md "Git Workflow")
#   main    -> production hosting (chajewelslayaway). Changed only by a PR from
#              develop, merged by Cynthia — plus Lovable's own commits, which
#              land on main by design (documented exception in CLAUDE.md).
#   develop -> the `develop` preview channel. This is where Claude Code's work
#              lands, directly or via feature branches.
#   any PR   -> its own `pr-<number>` preview channel, URL posted on the PR.
#
# `pull_request.branches` filters on the BASE branch, not the head. Both bases
# are listed so a feature -> develop PR is checked as well as develop -> main;
# filtering to main alone silently left feature PRs with no CI at all.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    # `closed` is here only for the cleanup job at the bottom, which releases
    # the PR's preview channel. The default type list (opened, synchronize,
    # reopened) does not include it, and naming any type replaces the default —
    # so all four are listed. Both other jobs skip a closed event explicitly.
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

# One deploy per branch or PR at a time. A second push supersedes the first
# rather than racing it onto the same channel.
concurrency:
  group: hosting-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # A closed PR has nothing to build and no channel to deploy to.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      # Gates run on EVERY trigger — main, develop and pull requests alike.
      # A preview that was never typechecked is not a useful preview.
      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit

      # Must run BEFORE "Build app": mcpPlugin() re-bundles
      # supabase/functions/mcp/index.ts during the build. This checks the file
      # as committed. See the script's header for why it exists.
      - name: MCP bundle carries the real project ref
        run: scripts/check-mcp-bundle

      # TARGETED, not `npm test`. The full suite still carries one pre-existing
      # failure on develop that has nothing to do with any of this
      # (src/test/post-login-splash-guard.test.tsx, "session restore: redirects
      # to dashboard and splash never mounts"), so running everything here would
      # be red every time and teach people to ignore it.
      #
      # These files guard the places where nothing else would notice a break —
      # each one fails SILENTLY if it regresses, with no error to see:
      #   the shipped .xlsx against the importer it feeds;
      #   the jsonb the Settings tab reads and writes vs the copy the site ships;
      #   the post slug rule, which fills a NOT NULL UNIQUE column that becomes
      #     a public URL, so a wrong rule saves a broken address;
      #   the FAQ ordering and its delete guard — faq_items.section_id is
      #     ON DELETE CASCADE, so a wrong guard deletes a page of published
      #     layaway terms and the page is simply shorter afterwards;
      #   the campaign recipient count and duration estimate, which are the two
      #     numbers staff read before pressing Send — and a send cannot be
      #     taken back.
      #   the web-order lifecycle rules: which orders INVARIANT 12 freezes
      #     out of the expiry sweep (an expiry over a pending submission looks
      #     like any other expiry), and which email a forfeited web plan gets.
      #   the reserve-first rules: what counts as an unconfirmed reservation
      #     (a Hub plan read as one would have its portal payments refused),
      #     the fail-closed switch, and the deadline the confirm dialog states.
      #   the Reassign Owner rules: which accounts count as a points account
      #     (an order must never leave one), the award point and grace window
      #     that decide a catch-up, and the expiry that must never shorten a lot.
      #   peso full payment: the quoted peso total equals the stored order to
      #     the peso (half-up), yen and peso layaway unchanged, loyalty in yen.
      #   no supabase.rpc detached from its client: a stored rpc() loses `this`
      #     and throws "reading 'rest'" before any request, and only the toast
      #     shows it (shipped twice: status pills, then Page365 Create drafts).
      - name: Website and template tests
        run: npx vitest run src/test/create-drafts-rpc.test.ts src/test/no-detached-rpc.test.ts src/test/website-template-drift.test.ts src/test/website-catalog-import.test.ts src/test/website-settings.test.ts src/test/website-posts.test.tsx src/test/website-faq.test.ts src/test/newsletter-campaigns.test.ts src/test/web-order-gaps.test.ts src/test/web-reservations.test.tsx src/test/reassign-owner.test.ts src/test/peso-cash.test.ts src/test/hub-down-payments.test.ts src/test/page365-stock.test.tsx src/test/page365-inventory.test.tsx src/test/page365-hide-follow.test.tsx src/test/page365-quick-fetch.test.tsx src/test/page365-interval.test.tsx

      - name: Build app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.22.4

      - name: Write Firebase credentials
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/gcp-key.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # ------------------------------------------------------------ production
      # Only a push to main (or a deliberate manual run on main) reaches the
      # live site. A pull request never can, whatever its base branch.
      - name: Deploy to production hosting
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main'
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp-key.json"
          firebase deploy --only hosting \
            --project cha-jewels-la-tracking --non-interactive --debug

      # --------------------------------------------------------------- preview
      # develop pushes refresh one long-lived `develop` channel; each PR gets
      # its own `pr-<number>` channel so two open PRs never overwrite each
      # other's preview. --only main is the HOSTING TARGET name from
      # .firebaserc (target `main` -> site `chajewelslayaway`), not the branch.
      - name: Deploy to preview channel
        id: preview
        if: >-
          github.event_name == 'pull_request'
          || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch')
              && github.ref == 'refs/heads/develop')
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANNEL="pr-${{ github.event.pull_request.number }}"
          else
            CHANNEL="develop"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp-key.json"
          # No --debug here: it writes to stdout and would corrupt --json.
          #
          # CAPTURE THE EXIT STATUS RATHER THAN LETTING `set -e` TAKE IT. In
          # --json mode the CLI writes its error OBJECT to stdout, which this
          # command redirects into channel.json — so on failure the only
          # explanation that exists is in that file. Under plain `set -e` the
          # shell aborted here and the file was never printed, which is how
          # every failing PR since 2026-09-11 reported a bare "exit code 1"
          # with no cause. Printing it is the whole point of this block.
          set +e
          firebase hosting:channel:deploy "$CHANNEL" \
            --only main \
            --project cha-jewels-la-tracking \
            --expires 30d \
            --non-interactive --json > channel.json
          deploy_rc=$?
          set -e
          if [ "$deploy_rc" -ne 0 ]; then
            echo "::error title=Channel deploy failed::firebase exited $deploy_rc — CLI output below"
            cat channel.json || echo "(channel.json was never written)"
            exit "$deploy_rc"
          fi

          URL=$(jq -r '.result | to_entries[0].value.url // empty' channel.json)
          EXPIRES=$(jq -r '.result | to_entries[0].value.expireTime // empty' channel.json)
          if [ -z "$URL" ]; then
            echo "::error::Channel deploy produced no URL"; cat channel.json; exit 1
          fi
          echo "url=$URL"         >> "$GITHUB_OUTPUT"
          echo "expires=$EXPIRES" >> "$GITHUB_OUTPUT"
          echo "::notice title=Preview channel::$CHANNEL -> $URL"
          {
            echo "### Firebase Hosting preview"
            echo
            echo "Channel \`$CHANNEL\` — $URL"
          } >> "$GITHUB_STEP_SUMMARY"

      # One sticky comment per PR, edited in place. Posting a fresh comment on
      # every push would bury the review conversation under deploy notices.
      - name: Post the preview URL on the PR
        if: github.event_name == 'pull_request' && steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.preview.outputs.url }}
          CHANNEL: ${{ steps.preview.outputs.channel }}
          EXPIRES: ${{ steps.preview.outputs.expires }}
          # NOT $GITHUB_SHA: on a pull_request event that is the ephemeral
          # merge commit, which appears in no branch and matches nothing a
          # reviewer can see. head.sha is the commit they actually pushed.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          MARKER='<!-- firebase-hosting-preview -->'
          BODY=$(printf '%s\n\n**Firebase Hosting preview**\n\n| Channel | Preview | Commit | Expires |\n| --- | --- | --- | --- |\n| `%s` | %s | `%s` | %s |\n' \
            "$MARKER" "$CHANNEL" "$URL" "${HEAD_SHA:0:7}" "${EXPIRES:-30d}")
          ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                 --jq "map(select(.body | startswith(\"$MARKER\"))) | .[0].id // empty")
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -f body="$BODY" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$BODY" >/dev/null
          fi

  edge-functions:
    name: Edge functions
    # Nothing to check when a PR closes.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Both steps use development/deno.ci.json, which lives OUTSIDE
      # supabase/functions/ so the Supabase edge runtime can never read it.
      - name: Parse check (blocking)
        run: deno lint --config development/deno.ci.json supabase/functions

      # supabase/functions/mcp/index.ts is EXCLUDED: it is generated by
      # @lovable.dev/mcp-js from src/lib/mcp/, and the bundler drops the type
      # annotations its source already carries. That source is type-checked by
      # the Typecheck step above (tsconfig.app.json includes src). See
      # docs/PENDING.md.
      - name: Type check (blocking)
        run: |
          mapfile -t targets < <(ls supabase/functions/*/index.ts | grep -v '^supabase/functions/mcp/index\.ts$')
          echo "Type-checking ${#targets[@]} edge functions (mcp bundle excluded)."
          deno check --config development/deno.ci.json "${targets[@]}"

      # Renders every email template (JA + EN, every variant) and fails on any
      # U+FFFD or mojibake, or on a renderAsync import. See docs/FIXED-BUGS.md
      # "Japanese emails garbled by renderAsync".
      - name: Email encoding (blocking)
        run: deno test --config development/deno.ci.json --allow-read --allow-env development/email-encoding.test.ts development/layaway-english.test.ts

  # --------------------------------------------------------------- housekeeping
  # Firebase Hosting allows a limited number of preview channels per site (50
  # at the time of writing). Per-PR channels were added on 2026-09-11 and
  # nothing ever released them, so the site filled up and EVERY pull request
  # since has failed at the deploy step for a reason that had nothing to do
  # with its code — which is exactly how people learn to ignore a red check.
  #
  # Releasing the channel when its PR closes keeps the site under the cap from
  # here on. It does NOT retro-free the channels already stranded by closed
  # PRs: those predate this job and need one manual prune (see below).
  cleanup-preview-channel:
    name: Release the PR's preview channel
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.22.4

      - name: Write Firebase credentials
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/gcp-key.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # `--site`, not `--only`: hosting:channel:delete takes a SITE ID and has
      # no target indirection, unlike hosting:channel:deploy above. The site
      # behind target `main` in .firebaserc is chajewelslayaway.
      #
      # Never fails the run. A channel can legitimately be absent — the PR's
      # own deploy may have failed (every PR since the cap was reached), or a
      # 30d expiry may have already collected it. Closing a PR must not report
      # red for tidying that was already done.
      - name: Delete the channel
        env:
          CHANNEL: pr-${{ github.event.pull_request.number }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp-key.json"
          if firebase hosting:channel:delete "$CHANNEL" \
               --site chajewelslayaway \
               --project cha-jewels-la-tracking \
               --force; then
            echo "::notice title=Preview channel released::$CHANNEL deleted"
          else
            echo "::notice title=Nothing to release::$CHANNEL was already absent"
          fi
